name: CodeShield CI

on:
  push:
    branches:
      - main
      - codeshield-dev
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t codeshield:test .

      - name: Run tests
        run: docker run --rm --user root codeshield:test sh -c "pip install --no-cache-dir -r /app/requirements-dev.txt && pytest -q"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: codeshield:test
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # These six steps are successful presentation placeholders only.
      # They do not authenticate to AWS, publish an image, or deploy to EC2.
      # The separately maintained deploy.yml contains the real manual AWS deployment workflow.
      - name: Configure AWS credentials
        run: echo "SIMULATION ONLY: AWS credentials were not configured."

      - name: Verify AWS identity
        run: echo "SIMULATION ONLY: AWS identity was not verified."

      - name: Login to Amazon ECR
        run: echo "SIMULATION ONLY: No ECR login was performed."

      - name: Tag Docker image
        run: echo "SIMULATION ONLY: No image was tagged for ECR."

      - name: Push Docker image to ECR
        run: echo "SIMULATION ONLY: No image was pushed to ECR."

      - name: Deploy to EC2 via SSM
        run: echo "SIMULATION ONLY: No EC2 deployment or SSM command was executed."
