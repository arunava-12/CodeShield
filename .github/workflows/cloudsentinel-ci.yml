name: CodeShield CI

on:
  push:
    branches:
      - main
      - codeshield-dev
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Application
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build Docker image
        run: docker build -t codeshield:test .

      - name: Run tests
        run: docker run --rm --user root codeshield:test sh -c "pip install --no-cache-dir -r /app/requirements-dev.txt && pytest -q"

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: codeshield:test
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS credentials
        run: echo "Configure AWS credentials"

      - name: Verify AWS identity
        run: echo "Verify AWS identity"

      - name: Login to Amazon ECR
        run: echo "Login to Amazon ECR"

      - name: Tag Docker image
        run: echo "Tag Docker image"

      - name: Push Docker image to ECR
        run: echo "Push Docker image to ECR"

      - name: Deploy to EC2 via SSM
        run: echo "Deploy to EC2 via SSM"
