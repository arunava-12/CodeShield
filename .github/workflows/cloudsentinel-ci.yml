name: CodeShield CI

on:
  push:
    branches:
      - main
      - codeshield-dev
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t codeshield:test .

      - name: Run tests
        run: docker run --rm codeshield:test pytest -q

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: codeshield:test
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::851725640243:role/CodeShield-github-actions-role
          aws-region: ap-south-1

      - name: Verify AWS identity
        if: github.event_name == 'push'
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag codeshield:test 851725640243.dkr.ecr.ap-south-1.amazonaws.com/codeshield:${{ github.sha }}
          docker tag codeshield:test 851725640243.dkr.ecr.ap-south-1.amazonaws.com/codeshield:latest

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          docker push 851725640243.dkr.ecr.ap-south-1.amazonaws.com/codeshield:${{ github.sha }}
          docker push 851725640243.dkr.ecr.ap-south-1.amazonaws.com/codeshield:latest

      - name: Deploy to EC2 via SSM
        if: github.event_name == 'push'
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-05798790401bee11c \
            --document-name "AWS-RunShellScript" \
            --parameters '{
              "commands": [
                "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 851725640243.dkr.ecr.ap-south-1.amazonaws.com",
                "docker pull 851725640243.dkr.ecr.ap-south-1.amazonaws.com/codeshield:${{ github.sha }}",
                "docker rm -f codeshield || true",
                "docker run -d --name codeshield -p 80:5000 --restart unless-stopped 851725640243.dkr.ecr.ap-south-1.amazonaws.com/codeshield:${{ github.sha }}",
                "sleep 10",
                "curl -fsS http://localhost/health"
              ]
            }' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-05798790401bee11c

          STATUS=$(aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-05798790401bee11c \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "EC2 deployment failed"
            aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-05798790401bee11c
            exit 1
          fi

          echo "EC2 deployment successful"